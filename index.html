<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>MK8DX Lounge Overlay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="overlay">
    <div class="player-name" id="name">Loading...</div>
    <div class="stats">
      <span class="label">MMR:</span>
      <span class="value" id="mmr">-</span>
    </div>
    <div class="stats">
      <span class="label">MAX:</span>
      <span class="value" id="max-mmr">-</span>
    </div>
  </div>

  <script>
    // URLパラメータからプレイヤー名を取得 (例: ?name=Vike)
    const urlParams = new URLSearchParams(window.location.search);
    const playerName = urlParams.get('name') || 'Vike';

    async function fetchStats() {
    try {
        const response = await fetch(`https://www.mk8dx-lounge.com/api/player/details?name=${encodeURIComponent(playerName)}`);
        
        console.log("Response status:", response.status); // ステータスコードの確認 (200なら成功, 404なら未検出など)

        if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const data = await response.json();
        console.log("Fetched data:", data); // 取得データの確認

        document.getElementById('name').textContent = data.name;
        document.getElementById('mmr').textContent = data.mmr;
        document.getElementById('max-mmr').textContent = data.maxMmr;
    } catch (err) {
        console.error('Fetch error details:', err);
        document.getElementById('name').textContent = 'Error';
    }
    }

    // 初回取得
    fetchStats();

    // 60秒ごとに自動更新（配信中のMMR変動を反映したい場合）
    setInterval(fetchStats, 60000);
  </script>
</body>
</html>
