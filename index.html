<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>MK8DX Lounge Overlay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="overlay">
    <div class="player-name" id="name">Loading...</div>
    <div class="stats">
      <span class="label">Win Rate:</span>
      <span class="value" id="win_rate">-</span>
    </div>
  </div>

  <script>
    // 1. URLパラメータから player の名前を取得（例: ?name=stardustfall）
    const urlParams = new URLSearchParams(window.location.search);
    
    // ★ ここで playerName を定義します（パラメータがない場合のデフォルト値も設定）
    const playerName = urlParams.get('name') || 'stardustfall';

    async function fetchStats() {
        try {
            // 2. 定義した playerName を使って API (/api/player) を呼び出す
            const res = await fetch(`/api/player?name=${encodeURIComponent(playerName)}`);
            
            if (!res.ok) {
                throw new Error(`HTTP error! status: ${res.status}`);
            }
            
            const data = await res.json();
            
            // 3. 画面上の要素を更新
            document.getElementById('name').textContent = data.name;
            document.getElementById('mmr').textContent = data.mmr;
            document.getElementById('max-mmr').textContent = data.maxMmr;
        } catch (err) {
            console.error('Failed to fetch stats:', err);
            document.getElementById('name').textContent = 'Error';
        }
    }

    // 初回実行
    fetchStats();

    // 60秒ごとに自動更新
    setInterval(fetchStats, 60000);
  </script>
</body>
</html>
